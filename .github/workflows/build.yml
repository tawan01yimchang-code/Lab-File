name: Build ESQZcity APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ถ้าใน repo มีแต่ไฟล์ซิป (ยังไม่แตก) ให้แตกซิปก่อน แล้วหาโฟลเดอร์ที่มี settings.gradle.kts
      - name: Locate project
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path '*/.git/*' | head -n1)
          if [ -z "$FILE" ] && ls ./*.zip >/dev/null 2>&1; then
            for z in ./*.zip; do
              echo "Extracting $z"
              unzip -q -o "$z" -d ./_project
            done
            FILE=$(find ./_project -name settings.gradle.kts | head -n1)
          fi
          if [ -z "$FILE" ]; then
            echo "::error::settings.gradle.kts not found in repository"
            find . -maxdepth 3 -not -path '*/.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          ls -la "$DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Add google-services.json (optional)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json added"
          else
            echo "No GOOGLE_SERVICES_JSON secret - building without Firebase plugin"
          fi

      # แสดงโครงสร้างโปรเจกต์ที่ Gradle มองเห็น เพื่อใช้ตรวจสอบเมื่อ build พัง
      - name: Diagnose project
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          echo "== files =="
          find . -maxdepth 3 -not -path './.git/*' | sort | head -60
          echo "== settings.gradle.kts =="
          cat settings.gradle.kts
          echo "== app/build.gradle.kts (head) =="
          head -20 app/build.gradle.kts
          echo "== gradle projects =="
          gradle projects --no-daemon --console=plain

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESQZcity-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

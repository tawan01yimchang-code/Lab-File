name: Build ESQZcity APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # โปรเจกต์ใช้ JDK 17 (compileOptions / jvmTarget = 17, AGP 8.5.2)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # compileSdk = 34
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # ในโปรเจกต์ไม่มี gradlew / gradle-wrapper.jar จึงติดตั้ง Gradle 8.7
      # ให้ตรงกับ gradle/wrapper/gradle-wrapper.properties (gradle-8.7-bin)
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Firebase จะถูกเปิดใช้เฉพาะเมื่อมี app/google-services.json
      # (ถ้าต้องการ Cloud Save ให้เก็บเนื้อไฟล์ไว้ใน Secret ชื่อ GOOGLE_SERVICES_JSON)
      - name: Add google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json added"
          else
            echo "No GOOGLE_SERVICES_JSON secret - building without Firebase plugin"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESQZcity-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
